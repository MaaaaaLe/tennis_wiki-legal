<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TikTok 인증 완료</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; line-height: 1.7; color: #222; }
  h1 { font-size: 22px; }
  #code-box { font-size: 16px; padding: 16px; background: #f2f2f2; border-radius: 8px; word-break: break-all; margin: 16px 0; }
  #error-box { color: #b00020; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h1>TikTok 인증 완료</h1>
<p>아래 코드를 복사해서 터미널의 <code>python auth_tiktok.py</code> 창에 붙여넣어 주세요.</p>
<div id="code-box">불러오는 중...</div>
<button id="copy-btn" style="display:none">복사하기</button>
<div id="error-box"></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error_description') || params.get('error');
  const codeBox = document.getElementById('code-box');
  const errorBox = document.getElementById('error-box');
  const copyBtn = document.getElementById('copy-btn');

  if (code) {
    codeBox.textContent = code;
    copyBtn.style.display = 'inline-block';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(code);
      copyBtn.textContent = '복사됨!';
    };
  } else {
    codeBox.textContent = '(코드 없음)';
    errorBox.textContent = error ? ('오류: ' + error) : '인증 코드가 전달되지 않았습니다.';
  }
</script>
</body>
</html>
